services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: festa
      POSTGRES_USER: festa
      POSTGRES_PASSWORD: festa
    ports: ["55432:5432"]  # porta alta: a máquina de dev já tem Postgres nativo em 5432 e 5433
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
