services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: festa
      POSTGRES_USER: festa
      POSTGRES_PASSWORD: festa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
