name: Dependências (vulnerabilidades)

# SECURITY.md: OWASP Dependency-Check na API e pnpm audit na web. Semanal e sob demanda, porque a base do NVD
# demora para baixar; o Dependabot cuida das atualizações no dia a dia.
on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 06h em São Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      # A base do NVD fica em cache entre as execuções (atualização incremental).
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # NVD_API_KEY: chave gratuita em https://nvd.nist.gov/developers/request-an-api-key (sem ela, a
      # primeira carga leva horas). Falha com CVSS >= 7.
      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -ntp org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON
          -DskipTestScope=true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: apps/api/target/dependency-check-report.*

  web:
    name: Web (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
