spring:
  application:
    name: festa-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/festa}
    username: ${DATABASE_USERNAME:festa}
    password: ${DATABASE_PASSWORD:festa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # SECURITY.md: rejeitar campos desconhecidos.
      fail-on-unknown-properties: true
  mail:
    # Dev: Mailpit do docker-compose (caixa em http://localhost:8025). Prod: SMTP do provedor via env.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  session:
    # ADR-001: sessão no Postgres, expira por inatividade. Tabelas criadas pela migration V002.
    timeout: ${SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never

festa:
  storage:
    # Cloudflare R2 (API S3). Em dev, S3Mock do docker-compose (application-local.yml).
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    # Domínio público (CDN) de onde as imagens são servidas.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL}
  mail:
    from: ${MAIL_FROM:FESTA <nao-responda@festa.local>}
  crypto:
    # CPF em repouso (SECURITY.md): AES-256-GCM e HMAC-SHA256, cada um com 32 bytes em base64.
    # Gerar com: openssl rand -base64 32. Trocar a chave exige migrar o que já foi gravado.
    personal-data-key: ${PERSONAL_DATA_KEY}
    personal-data-hash-key: ${PERSONAL_DATA_HASH_KEY}
  fees:
    # Taxa de serviço por ingresso, paga pelo comprador por cima do preço (ADR-007).
    # Em pontos-base: 1000 = 10%. Mínimo em centavos (0 = sem mínimo).
    service-fee-bps: ${SERVICE_FEE_BPS:1000}
    service-fee-min-cents: ${SERVICE_FEE_MIN_CENTS:0}
  orders:
    # Tempo que o pedido segura o estoque esperando o pagamento (PLAN.md M4).
    reservation-ttl: ${ORDER_RESERVATION_TTL:10m}
    expiry-job-delay: 30s
  legal:
    # Versão dos termos aceita no checkout. Trocar quando o texto jurídico mudar (PLAN.md M8).
    terms-version: ${TERMS_VERSION:rascunho-2026-10}
  web:
    # Base dos links enviados por e-mail.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
    # Origens da web autorizadas no CORS (com credenciais).
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # Domínio pai dos cookies em staging/prod (ex.: .festa.com). Vazio = host da API.
    cookie-domain: ${COOKIE_DOMAIN:}
    secure-cookies: ${SECURE_COOKIES:true}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  health:
    mail:
      # E-mail fora do ar não deve tirar a API do ar.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
