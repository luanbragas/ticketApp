spring:
  application:
    name: festa-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/festa}
    username: ${DATABASE_USERNAME:festa}
    password: ${DATABASE_PASSWORD:festa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # SECURITY.md: rejeitar campos desconhecidos.
      fail-on-unknown-properties: true
  mail:
    # Dev: Mailpit do docker-compose (caixa em http://localhost:8025). Prod: SMTP do provedor via env.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  session:
    # ADR-001: sessão no Postgres, expira por inatividade. Tabelas criadas pela migration V002.
    timeout: ${SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never

festa:
  mail:
    from: ${MAIL_FROM:FESTA <nao-responda@festa.local>}
  web:
    # Base dos links enviados por e-mail.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
    # Origens da web autorizadas no CORS (com credenciais).
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # Domínio pai dos cookies em staging/prod (ex.: .festa.com). Vazio = host da API.
    cookie-domain: ${COOKIE_DOMAIN:}
    secure-cookies: ${SECURE_COOKIES:true}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  health:
    mail:
      # E-mail fora do ar não deve tirar a API do ar.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
