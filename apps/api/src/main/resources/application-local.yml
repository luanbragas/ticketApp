# Perfil local: usa o Postgres do infra/docker-compose.yml (credenciais padrão de dev).
logging:
  level:
    com.festa: DEBUG

festa:
  storage:
    # S3Mock do infra/docker-compose.yml (não confere assinatura nem credenciais).
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9090}
    region: us-east-1
    bucket: festa-media
    access-key: festa
    secret-key: festa-dev-secret
    public-base-url: http://localhost:9090/festa-media
  crypto:
    # Chaves só de desenvolvimento (dados de teste). Produção usa PERSONAL_DATA_KEY e PERSONAL_DATA_HASH_KEY.
    personal-data-key: RkLdd72iWmwD3IMDHUJPwwNxvOYBVlqX/dfWkgqVMxo=
    ticket-token-key: ZXBgZg6suYIWYLy0NkNpZCY3DaLdjvs7WdH53jM7Yig=
    personal-data-hash-key: 0lw6xGL2c0VF4Enz65ucYW6LIZXQFPhwpVBg2A7qSQo=
  security:
    # http://localhost não usa HTTPS.
    secure-cookies: false
