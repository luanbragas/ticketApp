# Testes rodam a virada na mão (TicketingService.rolloverEvent): o job em segundo plano deixaria o resultado aleatório.
festa.jobs.enabled=false
# O rate limit tem teste próprio (RateLimitTest); nos outros, muitos cadastros saem do mesmo "IP".
festa.rate-limit.enabled=false
# Segredo do webhook só para os testes de assinatura.
festa.payments.mercadopago.webhook-secret=segredo-de-teste
